# Ultralytics YOLO26s-seg with CARAFE upsampling + ASPP context (A3 Experiment)
# Baseline: yolo26-seg.yaml (scale s)
# Combined modifications:
# 1. Layer 11: ASPP(rates=[3, 6, 9]) at P5 high-level context
# 2. Layers 12 and 15: CARAFE(scale=2, kernel_size=5, encoder_kernel=3, compressed_channels=64) for top-down upsampling

# Parameters
nc: 80 # number of classes
scale: s # fix default scale to 's'
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26s backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 (P5/32 context)

# YOLO26s head with ASPP context + CARAFE top-down path
head:
  - [-1, 1, ASPP, [None, [3, 6, 9]]] # 11: ASPP context enrichment at P5

  - [-1, 1, CARAFE, [2, 5, 3, 64]] # 12: CARAFE upsample P5->P4
  - [[-1, 6], 1, Concat, [1]] # 13: cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 14

  - [-1, 1, CARAFE, [2, 5, 3, 64]] # 15: CARAFE upsample P4->P3
  - [[-1, 4], 1, Concat, [1]] # 16: cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 14], 1, Concat, [1]] # 19: cat head P4
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 11], 1, Concat, [1]] # 22: cat head P5 (ASPP enriched feature)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 (P5/32-large)

  - [[17, 20, 23], 1, Segment26, [nc, 32, 256]] # 24: Segment26(P3, P4, P5)
