# Cityscapes semantic segmentation dataset.
# The native Cityscapes labelIds masks contain 19 trainable semantic classes,
# including traffic sign (class 7). This is not an instance-segmentation YAML.

# Remote training root. Extract leftImg8bit and gtFine under this directory
# before running the training script.
path: /workspace/Cityscapes
train: images/train
val: images/val
masks_dir: masks

names:
  0: road
  1: sidewalk
  2: building
  3: wall
  4: fence
  5: pole
  6: traffic light
  7: traffic sign
  8: vegetation
  9: terrain
  10: sky
  11: person
  12: rider
  13: car
  14: truck
  15: bus
  16: train
  17: motorcycle
  18: bicycle

# Cityscapes labelIds -> contiguous train IDs. Unused labels become ignore (255).
label_mapping:
  -1: ignore_label
  0: ignore_label
  1: ignore_label
  2: ignore_label
  3: ignore_label
  4: ignore_label
  5: ignore_label
  6: ignore_label
  7: 0
  8: 1
  9: ignore_label
  10: ignore_label
  11: 2
  12: 3
  13: 4
  14: ignore_label
  15: ignore_label
  16: ignore_label
  17: 5
  18: ignore_label
  19: 6
  20: 7
  21: 8
  22: 9
  23: 10
  24: 11
  25: 12
  26: 13
  27: 14
  28: 15
  29: ignore_label
  30: ignore_label
  31: 16
  32: 17
  33: 18
